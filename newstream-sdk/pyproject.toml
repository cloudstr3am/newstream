[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newstream"
version = "0.1.0"
description = "Stream every AI session event in real time"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["requests>=2.28.0"]

[project.urls]
Homepage = "https://github.com/cloudstr3am/newstream"
